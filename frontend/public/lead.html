<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Share Your Details</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        color: #111;
      }

      .main-container {
        min-height: 100vh;
        padding: 3rem 1rem;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
      }

      .form {
        width: 400px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .field {
        width: 100%;
      }

      label {
        display: block;
        margin-bottom: 0.4rem;
        font-size: 14px;
        font-weight: 600;
      }

      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 16px;
        border: 1px solid gray;
        border-radius: 8px;
        outline: none;
      }

      textarea {
        min-height: 128px;
        resize: vertical;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        text-align: center;
      }

      .subtitle {
        margin: 0;
        color: #666;
        text-align: center;
        margin-top: -1.25rem;
        margin-bottom: 1.25rem;
      }

      .logo-container {
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-container img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .rating-container {
        width: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      .rating-label {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }

      .star-rating {
        display: flex;
        justify-content: center;
        gap: 4px;
      }

      .star {
        background: none;
        border: none;
        padding: 0;
        font-size: 38px;
        line-height: 1;
        cursor: pointer;
        color: #d9d9d9;
      }

      .star.active {
        color: #feb72d;
      }

      #submitButton {
        max-width: 100%;
        margin-top: 1rem;
        padding: 16px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: #4b35f5;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="app" class="main-container"></div>

    <script>
      const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";

      const config = {
        apiV2URL: isLocal
          ? "https://nprjpm16wd.execute-api.us-east-1.amazonaws.com/default"
          : "https://di0ssgj8dl.execute-api.us-east-1.amazonaws.com/default",
      };

      const params = new URLSearchParams(window.location.search);

      const logo = params.get("logo");
      const destination = params.get("destination");
      const campaign_id = params.get("campaign_id");
      const visit_id = params.get("visit_id");

      const fields = {
        name: params.get("name") === "true",
        email: params.get("email") === "true",
        phone: params.get("phone") === "true",
        title: params.get("title") === "true",
        comment: params.get("comment") === "true",
        rating: params.get("rating") === "true", // NEW: show rating only if rating=true
      };

      const isValid = campaign_id && visit_id;
      const app = document.getElementById("app");

      let selectedRating = 0;

      if (!isValid) {
        if (destination) window.location.href = destination;
      } else {
        renderForm();
      }

      function renderForm() {
        app.innerHTML = `
          ${
            logo
              ? `
                <div class="logo-container">
                  <img
                    id="logo"
                    src="${logo}"
                    alt="logo for this campaign"
                    onerror="this.style.display='none'"
                  />
                </div>
              `
              : ""
          }

          <h1>Share a Few Details</h1>
          <p class="subtitle">Please fill out the form</p>

          <div class="form">
            ${fields.name ? inputField("name", "Name:") : ""}
            ${fields.email ? inputField("email", "Email:", "email") : ""}
            ${fields.phone ? inputField("phone", "Phone:", "tel") : ""}
            ${fields.title ? inputField("title", "Job Title:") : ""}
            ${fields.comment ? textAreaField("comment", "Comments:") : ""}

            ${
              fields.rating
                ? `
                  <div class="rating-container">
                    <p class="rating-label">Rate your experience:</p>

                    <div class="star-rating">
                      <button type="button" class="star" data-rating="1">★</button>
                      <button type="button" class="star" data-rating="2">★</button>
                      <button type="button" class="star" data-rating="3">★</button>
                      <button type="button" class="star" data-rating="4">★</button>
                      <button type="button" class="star" data-rating="5">★</button>
                    </div>
                  </div>
                `
                : ""
            }

            <button id="submitButton">Visit Website →</button>
          </div>
        `;

        if (fields.rating) {
          document.querySelectorAll(".star").forEach((star) => {
            star.addEventListener("click", () => {
              selectedRating = Number(star.dataset.rating);

              document.querySelectorAll(".star").forEach((s) => {
                s.classList.toggle("active", Number(s.dataset.rating) <= selectedRating);
              });
            });
          });
        }

        document.getElementById("submitButton").addEventListener("click", handleSubmit);
      }

      function inputField(name, label, type = "text") {
        return `
          <div class="field">
            <label for="${name}">${label}</label>
            <input id="${name}" name="${name}" type="${type}" />
          </div>
        `;
      }

      function textAreaField(name, label) {
        return `
          <div class="field">
            <label for="${name}">${label}</label>
            <textarea
              id="${name}"
              name="${name}"
              placeholder="Add any additional context here..."
            ></textarea>
          </div>
        `;
      }

      async function handleSubmit() {
        const button = document.getElementById("submitButton");
        button.disabled = true;
        button.textContent = "Opening...";

        const fieldsToSet = {};

        ["name", "email", "phone", "title", "comment"].forEach((key) => {
          const el = document.getElementById(key);

          if (el && el.value.trim()) {
            fieldsToSet[key] = el.value.trim();
          }
        });

        if (fields.rating && selectedRating > 0) {
          fieldsToSet.rating = selectedRating;
        }

        try {
          await fetch(`${config.apiV2URL}/campaign/lead`, {
            method: "PUT",
            mode: "cors",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              campaign_id,
              visit_id,
              fieldsToSet,
            }),
          });
        } catch (error) {
          console.log(error);
        } finally {
          if (destination) {
            window.location.href = destination;
          } else {
            button.disabled = false;
            button.textContent = "Visit Website →";
          }
        }
      }
    </script>
  </body>
</html>
